<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0}body{background:var(--ground);color:var(--ink);font-family:var(--font-body);}.w{display:flex;flex-direction:column;gap:16px;padding:24px;max-width:342px}.b{height:60px;border-radius:14px;font:600 18px var(--font-body);cursor:pointer}.p{background:var(--accent);color:var(--on-accent);border:0}.p:active{background:var(--accent-pressed)}.s{background:transparent;color:var(--ink);border:1.5px solid var(--line-strong);height:56px;font-size:17px}.b:focus-visible{outline:2px solid var(--accent);outline-offset:3px}</style></head>
<body>
<div class="w"><button class="b p" type="button">Start the day</button><button class="b s" type="button">Busy for 1 hour</button></div>
</body>
</html>
