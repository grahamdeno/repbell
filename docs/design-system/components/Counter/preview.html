<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Counter preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0}body{background:var(--ground);color:var(--ink);font-family:var(--font-body);}.w{display:flex;flex-direction:column;gap:12px;padding:24px;max-width:342px}.p{height:320px;border:1.5px solid var(--line);border-radius:28px;background:var(--surface);display:flex}.c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.s{font-family:var(--font-display);font-weight:600;font-size:36px;color:var(--ink-faint)}.num{font-family:var(--font-display);font-weight:800;font-size:160px;line-height:.9;color:var(--accent)}.t{width:28px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:24px 0}.t i{display:block;height:2px;width:8px;background:var(--line-strong);border-radius:1px}.t i.mj{width:14px;background:var(--ink-faint)}.t i.now{width:20px;background:var(--accent)}.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.k{height:60px;border-radius:14px;border:1.5px solid var(--line-strong);background:transparent;color:var(--ink);font:700 28px var(--font-display)}.d{height:60px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font:600 18px var(--font-body)}</style></head>
<body>
<div class="w"><div class="p"><div class="c"><span class="s">51</span><span class="num">50</span><span class="s">49</span></div><div class="t"><i class="mj"></i><i></i><i></i><i></i><i></i><i class="mj"></i><i></i><i class="now"></i><i></i><i></i><i class="mj"></i><i></i><i></i><i></i><i></i></div></div><div class="row"><button type="button" class="k">−1</button><button type="button" class="k">+1</button><button type="button" class="d">Done</button></div></div>
</body>
</html>
