<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rep Bell</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font-body);overflow:hidden}
.cover{position:relative;height:288px;overflow:hidden}
.art{position:absolute;top:0;left:480px;width:480px;height:288px;overflow:hidden}
.art svg{display:block;width:480px;height:288px}
.acc{fill:var(--accent)}
.srf{fill:var(--surface)}
.ln{fill:var(--line)}
.ink{fill:var(--ink)}
.chev{fill:none;stroke:var(--accent);stroke-linecap:round;stroke-linejoin:round}
.chev.dark{stroke:var(--on-accent)}
.slab{rx:var(--radius-panel)}
.card{rx:var(--radius-card)}
.bar{rx:var(--radius-bar)}
.glyph{font-family:var(--font-display);font-weight:900;fill:var(--ground)}
.words{position:absolute;left:var(--space-6);bottom:var(--space-6);max-width:440px}
.name{margin:0;font-family:var(--font-display);font-weight:800;font-size:88px;line-height:.92;text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.tag{margin:var(--space-2) 0 0 2px;font-size:14px;line-height:20px;color:var(--ink-muted)}
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent slab 192x264 bleeding off the top (the brand's one orange, largest) · surface 160x152 · ink 64x6 bars as done sets · line 64x6 bars as upcoming · together about 30% of 960x288
  arrangement one tall accent slab with satellites to its right, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     "a distinctive numerals face → one oversized numeral used as a shape": a giant 14 cut out of the slab in ground, with the icon's chevron above it; a short stack of chevrons rising over the surface block, from "your max goes up"
  scales      sides in space-2 multiples; gutters space-4; corners radius-panel (slab), radius-card (surface), radius-bar (set bars)
-->
<rect class="acc slab" x="16" y="-24" width="192" height="288" rx="28"/>
<path class="chev dark" d="M64 72l48 -34 48 34" stroke-width="18"/>
<text class="glyph" x="112" y="248" text-anchor="middle" font-size="200">14</text>
<rect class="srf card" x="224" y="112" width="160" height="152" rx="16"/>
<path class="chev" d="M264 176l40 -28 40 28" stroke-width="12"/>
<path class="chev" d="M264 216l40 -28 40 28" stroke-width="12" style="stroke:var(--line-strong)"/>
<rect class="ink bar" x="400" y="160" width="64" height="6" rx="3"/>
<rect class="ink bar" x="400" y="176" width="64" height="6" rx="3"/>
<rect class="ink bar" x="400" y="192" width="64" height="6" rx="3"/>
<rect class="acc bar" x="400" y="208" width="64" height="6" rx="3"/>
<rect class="ln bar" x="400" y="224" width="64" height="6" rx="3"/>
<rect class="ln bar" x="400" y="240" width="64" height="6" rx="3"/>
<rect class="ln bar" x="400" y="256" width="64" height="6" rx="3"/>
</svg>
</div>
<div class="words">
<h1 class="name">Rep Bell</h1>
<p class="tag">Set your max once. Your wrist tells you when to drop and how many.</p>
</div>
</div>
</body>
</html>
