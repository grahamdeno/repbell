<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SetAlert preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0}body{background:var(--ground);color:var(--ink);font-family:var(--font-body)}.w{padding:16px;max-width:342px}.f{background:var(--flood);color:var(--amber);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:6px;min-height:340px;box-sizing:border-box}.top{display:flex;align-items:center;gap:10px}.e{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--flood-soft)}.num{font-family:var(--font-display);font-weight:800;font-size:160px;line-height:.9;color:var(--amber)}.c{font-size:15px;font-weight:500;color:var(--flood-soft)}.sp{flex:1}.b{height:60px;border-radius:14px;border:0;background:var(--amber);color:var(--on-amber);font:600 18px var(--font-body)}.s{height:56px;border-radius:14px;border:1.5px solid var(--flood-soft);background:transparent;color:var(--ink);font:600 17px var(--font-body);margin-top:10px}</style></head>
<body>
<div class="w"><div class="f" role="img" aria-label="The bell-ring flood: 30 now, set 6 of 21, Day 3"><div class="top"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="e">Set 6 of 21 · Day 3</span></div><span class="num">30</span><span class="c">push-ups now</span><div class="sp"></div><button class="b" type="button">Done</button><button class="s" type="button">In 10 min</button></div></div>
</body>
</html>
